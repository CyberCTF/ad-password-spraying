
# The flag lives here. Only k.verma (and Domain Admins) may open the share, so the flag
# is reachable only once k.verma's password has been recovered by password spraying.
[storeops]
   path = /srv/storeops
   read only = yes
   browseable = yes
   valid users = SUMMIT\k.verma, @"SUMMIT\Domain Admins"
