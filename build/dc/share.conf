
# The flag lives here. Only samwell.tarly (and Domain Admins) may open the share, so the flag
# is reachable only once samwell.tarly's password has been recovered by password spraying.
[nightswatch]
   path = /srv/nightswatch
   read only = yes
   browseable = yes
   valid users = NORTH\samwell.tarly, @"NORTH\Domain Admins"
